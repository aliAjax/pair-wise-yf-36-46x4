<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生物样本库知情同意与撤回</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 1.5rem; color: #1f2937; background: #f9fafb; }
    main { max-width: 960px; margin: auto; }
    h1 { margin-bottom: .25rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
    button { padding: .35rem .7rem; cursor: pointer; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; font-size: .85rem; }
    button.primary { background: #2563eb; color: #fff; border-color: #1d4ed8; }
    button.danger { background: #dc2626; color: #fff; border-color: #b91c1c; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .entity { border-left: 4px solid #d1d5db; padding: .5rem .75rem; margin: .5rem 0; background: #f9fafb; border-radius: 0 6px 6px 0; }
    .entity .line { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .entity .meta { font-size: .78rem; color: #6b7280; font-family: ui-monospace, monospace; }
    .entity.consent { border-left-color: #7c3aed; }
    .entity.sample { border-left-color: #0891b2; }
    .entity.withdrawal { border-left-color: #dc2626; }
    .badge { font-size: .72rem; padding: .1rem .5rem; border-radius: 999px; font-weight: 600; }
    .s-active, .s-stored, .s-registered, .s-approved { background: #dcfce7; color: #166534; }
    .s-withdrawn, .s-closed, .s-destroyed { background: #fee2e2; color: #991b1b; }
    .s-on_loan { background: #fef9c3; color: #854d0e; }
    .s-return_pending { background: #ffedd5; color: #9a3412; }
    .s-draft, .s-collected, .s-requested { background: #e5e7eb; color: #374151; }
    .s-superseded, .s-anonymized { background: #e0e7ff; color: #3730a3; }
    .s-executed { background: #dbeafe; color: #1e40af; }
    .actions { display: flex; gap: .35rem; flex-wrap: wrap; }
    .panel { margin-top: .6rem; padding: .6rem; background: #eff6ff; border-radius: 8px; border: 1px solid #bfdbfe; }
    .panel label { font-size: .8rem; margin-right: .5rem; }
    .panel input[type=text], .panel select { padding: .25rem .4rem; border: 1px solid #9ca3af; border-radius: 4px; font-size: .85rem; }
    .checklist label { display: block; font-size: .82rem; margin: .2rem 0; }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; }
    #modal.open { display: flex; }
    .modal-card { background: #fff; border-radius: 12px; padding: 1.25rem; width: min(720px, 92vw); max-height: 86vh; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; margin: .5rem 0; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #e5e7eb; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 8px; padding: .6rem .8rem; margin: .5rem 0; white-space: pre-wrap; font-size: .85rem; }
    .ok-note { color: #166534; font-size: .85rem; }
    h3 { margin: .8rem 0 .3rem; font-size: .95rem; color: #374151; }
    .muted { color: #6b7280; font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>生物样本库知情同意与撤回</h1>
  <p class="muted">演示流程：创建参与者 → 激活同意 → 样本入库/借出 → 批准撤回 → <b>预览影响范围 → 一次执行</b>。执行时若同意版本或样本状态已变化，会拒绝并列出冲突。</p>
  <div class="toolbar">
    <button onclick="refresh()">刷新列表</button>
    <button onclick="openCreate('participant')">新建参与者</button>
    <button onclick="openCreate('consent')">新建同意(草案)</button>
    <button onclick="openCreate('sample')">新建样本(采集)</button>
    <button onclick="openCreate('withdrawal')">新建撤回申请</button>
    <button onclick="seedDemo()">生成演示数据</button>
  </div>
  <div id="root"><p class="muted">加载中…</p></div>
</main>

<div id="modal"><div class="modal-card">
  <div id="modalBody"></div>
  <div class="toolbar" style="justify-content:flex-end">
    <button onclick="closeModal()">关闭</button>
    <span id="modalOk"></span>
  </div>
</div></div>

<script>
const STATUS_CN = {
  registered: '在册', closed: '已关闭', draft: '草案', active: '生效',
  superseded: '已被替代', withdrawn: '已撤回', collected: '已采集',
  stored: '在库', on_loan: '借出中', return_pending: '待归还',
  anonymized: '已匿名化', destroyed: '已销毁', requested: '待批准',
  approved: '已批准', executed: '已执行'
};
const state = { participants: [], consents: [], samples: [], withdrawals: [], message: null };

async function api(path, options) {
  const response = await fetch(path, Object.assign({
    headers: Object.assign({'Content-Type': 'application/json'}, (options && options.headers) || {})
  }, options || {}));
  const payload = await response.json();
  if (!response.ok) throw Object.assign(new Error(payload.error || ('HTTP ' + response.status)), { payload });
  return payload;
}
function actHeaders(role, idem) {
  return { 'X-User-Id': 'web-' + role, 'X-Role': role, ...(idem ? {'Idempotency-Key': idem} : {}) };
}
async function action(id, name, data, role = 'admin', idem) {
  return api('/api/entities/' + encodeURIComponent(id) + '/actions', {
    method: 'POST',
    headers: actHeaders(role, idem),
    body: JSON.stringify({ action: name, data })
  });
}
async function create(kind, data, role) {
  return api('/api/' + kind, { method: 'POST', headers: actHeaders(role), body: JSON.stringify(data) });
}
function badge(status) {
  return '<span class="badge s-' + status + '">' + (STATUS_CN[status] || status) + '</span>';
}
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function refresh() {
  const [p, c, s, w] = await Promise.all([
    api('/api/participants'), api('/api/consents'),
    api('/api/samples'), api('/api/withdrawals')
  ]);
  state.participants = p.items; state.consents = c.items;
  state.samples = s.items; state.withdrawals = w.items;
  render();
}

function render() {
  const root = document.getElementById('root');
  const msg = state.message
    ? ('<div class="' + (state.message.type === 'error' ? 'error' : 'ok-note') + '">' +
       state.message.title + '\n' + esc(state.message.body || '') + '</div>') : '';
  if (!state.participants.length) {
    root.innerHTML = msg + '<p class="muted">还没有参与者，点“新建参与者”或“生成演示数据”开始。</p>';
    return;
  }
  root.innerHTML = msg + state.participants.map(p => {
    const consents = state.consents.filter(c => c.data.participant_id === p.id);
    const samples = state.samples.filter(s => s.data.participant_id === p.id);
    const withdrawals = state.withdrawals.filter(w => w.data.participant_id === p.id);
    return '<div class="card"><h2 style="margin:0 0 .25rem">' + esc(p.data.name) + ' ' + badge(p.status) +
      '</h2><div class="meta">' + p.id + '</div>' +
      '<h3>知情同意</h3>' + (consents.length ? consents.map(consentRow).join('') : '<span class="muted">无</span>') +
      '<h3>样本</h3>' + (samples.length ? samples.map(s => sampleRow(s, p.id)).join('') : '<span class="muted">无</span>') +
      '<h3>撤回单</h3>' + (withdrawals.length ? withdrawals.map(withdrawalRow).join('') : '<span class="muted">无</span>') +
      '</div>';
  }).join('');
}

function entityHead(e, kind, title) {
  return '<div class="entity ' + kind + '"><div class="line"><div><b>' + esc(title) + '</b> ' +
    badge(e.status) + ' <span class="meta">v' + e.version + ' · ' + esc(e.id) + '</span></div>' +
    '<div class="actions" id="act-' + esc(e.id) + '"></div></div>';
}
function consentRow(c) {
  let html = entityHead(c, 'consent', '同意 ' + esc(c.data.version || '(草案)'));
  html += '<div class="meta">范围: ' + esc((c.data.scope || []).join(', ')) + '</div>';
  html += '<div id="extra-' + esc(c.id) + '"></div></div>';
  queueMicrotask(() => {
    const box = document.getElementById('act-' + c.id);
    if (!box) return;
    if (c.status === 'draft') box.innerHTML = '<button onclick="activateConsent(\'' + c.id + '\')">激活</button>';
    if (c.status === 'active') box.innerHTML = '<button onclick="supersedeConsent(\'' + c.id + '\')">替代此版本</button>';
  });
  return html;
}
function sampleRow(s) {
  let html = entityHead(s, 'sample', '样本 ' + esc(s.data.sample_code));
  const detail = s.status === 'on_loan' ? ('借予 ' + esc(s.data.recipient) + '，应还 ' + esc(s.data.due_at))
    : s.status === 'return_pending' ? '撤回已执行，等待归还后销毁'
    : s.status === 'destroyed' ? '销毁原因: ' + esc(s.data.destroyed_reason || s.data.reason || '')
    : s.data.freezer ? (esc(s.data.freezer) + ' / ' + esc(s.data.position)) : '已采集，未入库';
  html += '<div class="meta">' + detail + '</div></div>';
  queueMicrotask(() => {
    const box = document.getElementById('act-' + s.id);
    if (!box) return;
    if (s.status === 'stored') box.innerHTML =
      '<button onclick="loanSample(\'' + s.id + '\')">借出</button>' +
      '<button onclick="anonymizeSample(\'' + s.id + '\')">匿名化</button>' +
      '<button class="danger" onclick="destroySample(\'' + s.id + '\')">手工销毁</button>';
    if (s.status === 'on_loan' || s.status === 'return_pending')
      box.innerHTML = '<button onclick="returnSample(\'' + s.id + '\')">归还' +
        (s.status === 'return_pending' ? '（将直接销毁）' : '') + '</button>';
  });
  return html;
}
function withdrawalRow(w) {
  let html = entityHead(w, 'withdrawal', '撤回单 ' + esc(w.data.reason ? '· ' + w.data.reason : ''));
  html += '<div class="meta">申请于 ' + esc(w.data.requested_at) +
    (w.data.sample_ids ? '，批准关联样本 ' + w.data.sample_ids.length + ' 个' : '') + '</div></div>';
  queueMicrotask(() => {
    const box = document.getElementById('act-' + w.id);
    if (!box) return;
    if (w.status === 'requested') box.innerHTML = '<button class="primary" onclick="approveWithdrawal(\'' + w.id + '\')">批准</button>';
    if (w.status === 'approved') box.innerHTML =
      '<button class="primary" onclick="planWithdrawal(\'' + w.id + '\')">预览影响并执行</button>';
    if (w.status === 'executed') {
      const d = w.data;
      box.parentElement.nextElementSibling.insertAdjacentHTML('beforeend',
        '<div class="ok-note">执行结果：撤回同意 ' + (d.consent_ids || []).length +
        ' · 销毁样本 ' + (d.destroyed_sample_ids || []).length +
        ' · 待归还 ' + (d.pending_return_sample_ids || []).length +
        '（执行于 ' + esc(d.executed_at) + '）</div>');
    }
  });
  return html;
}

/* ---------- entity actions ---------- */
async function activateConsent(id) {
  const expires = prompt('到期日 (YYYY-MM-DD)', '2099-01-01');
  if (!expires) return;
  const c = state.consents.find(x => x.id === id);
  await runAction(() => action(id, 'activate',
    {scope: c.data.scope, version: 'v' + (c.version + 1), expires_at: expires}, 'committee'));
}
async function supersedeConsent(id) {
  const reason = prompt('替代原因', '新版本同意');
  if (!reason) return;
  await runAction(() => action(id, 'supersede', {reason}, 'committee'));
}
async function loanSample(id) {
  const recipient = prompt('接收机构', '外部实验室');
  if (!recipient) return;
  await runAction(() => action(id, 'loan',
    {recipient, purpose: '合作研究', due_at: '2026-12-31'}, 'biobank'));
}
async function returnSample(id) { await runAction(() => action(id, 'return', {note: '已归还'}, 'biobank')); }
async function anonymizeSample(id) {
  const reason = prompt('匿名化原因', '单独处理');
  if (!reason) return;
  await runAction(() => action(id, 'anonymize', {reason}, 'biobank'));
}
async function destroySample(id) {
  if (!confirm('确认手工销毁该样本？')) return;
  await runAction(() => action(id, 'destroy', {reason: '手工销毁'}, 'biobank'));
}

function approveWithdrawal(id) {
  const w = state.withdrawals.find(x => x.id === id);
  const samples = state.samples.filter(s => s.data.participant_id === w.data.participant_id);
  const body = '<h2>批准撤回单</h2><p class="muted">勾选本次撤回关联的样本：</p>' +
    '<div class="checklist" id="approveList">' + samples.map(s =>
      '<label><input type="checkbox" value="' + esc(s.id) + '" checked> ' +
      esc(s.data.sample_code) + ' ' + badge(s.status) + '</label>').join('') +
    '</div>' +
    '<p><label>原因</label><input type="text" id="approveReason" value="participant request"></p>' +
    '<div id="approveMsg"></div>';
  openModal(body, '<button class="primary" id="approveBtn">批准</button>');
  document.getElementById('approveBtn').onclick = async () => {
    const sampleIds = [...document.querySelectorAll('#approveList input:checked')].map(x => x.value);
    try {
      await action(id, 'approve',
        {reason: document.getElementById('approveReason').value, sample_ids: sampleIds},
        'committee');
      closeModal();
      await refresh();
    } catch (error) {
      showInline('approveMsg', error);
    }
  };
}

let planCache = {};
async function planWithdrawal(id) {
  const executedAt = prompt('执行时间 (YYYY-MM-DD)', new Date().toISOString().slice(0, 10));
  if (!executedAt) return;
  let plan;
  try {
    plan = await action(id, 'plan_execute', {executed_at: executedAt}, 'biobank');
  } catch (error) {
    state.message = {type: 'error', title: '无法预览：' + error.message, body: detailText(error)};
    render();
    return;
  }
  planCache = {id, executedAt, plan};
  const rows = items => items.map(i => '<tr><td>' + esc(i.id.slice(0, 8)) + '</td><td>' +
    badge(i.from_status) + '</td><td>→</td><td>' + badge(i.to_status) + '</td></tr>').join('');
  const body = '<h2>执行影响范围（执行前预览）</h2>' +
    '<p class="muted">撤回单 <b>' + esc(id) + '</b> 当前 ' + badge('approved') +
    '（v' + plan.withdrawal.version + '）。确认后将在一次事务中完成下列变更：</p>' +
    '<h3>生效同意（一起撤回）</h3>' +
    (plan.consents.length ? '<table><tr><th>同意</th><th>当前</th><th></th><th>执行后</th></tr>' + rows(plan.consents) + '</table>'
      : '<p class="muted">该参与者当前没有生效同意。</p>') +
    '<h3>关联样本</h3>' +
    (plan.samples.length ? '<table><tr><th>样本</th><th>当前</th><th></th><th>执行后</th></tr>' + rows(plan.samples) + '</table>'
      : '<p class="muted">批准时没有关联样本。</p>') +
    '<p class="muted">借出样本先变为“待归还”，归还后直接销毁；在库样本立即销毁。' +
    '页面已记录上述版本，执行时若同意版本或样本状态发生变化，将整体拒绝并列出冲突。</p>' +
    '<div id="execMsg"></div>';
  openModal(body,
    '<button class="primary" id="confirmExec">确认一次执行</button>' +
    '<button id="retryExec">执行（同键重试）</button>');
  document.getElementById('confirmExec').onclick = () => executeWithdrawal(false);
  document.getElementById('retryExec').onclick = () => executeWithdrawal(true);
}

async function executeWithdrawal(retry) {
  const {id, executedAt, plan} = planCache;
  const idem = retry ? 'wd-' + id + '-' + executedAt : ('wd-' + id + '-' + executedAt);
  const msg = document.getElementById('execMsg');
  try {
    const result = await action(id, 'execute',
      {executed_at: executedAt, expected_versions: plan.expected_versions},
      'biobank', idem);
    await showExecuted(result);
  } catch (error) {
    showInlineEl(msg, error);
  }
}

async function showExecuted(result) {
  const w = result.withdrawal;
  const view = e => '<tr><td>' + esc(e.kind) + ' ' + esc(e.id.slice(0, 8)) +
    '</td><td>' + badge(e.status) + '</td><td>v' + e.version + '</td></tr>';
  const body = '<h2>撤回单已执行</h2><p class="ok-note">' +
    '撤回同意 ' + result.summary.consents_withdrawn + ' · 销毁样本 ' +
    result.summary.samples_destroyed + ' · 待归还 ' + result.summary.samples_pending_return +
    '</p><h3>处理后的状态</h3>' +
    '<table><tr><th>对象</th><th>状态</th><th>版本</th></tr>' +
    view(w) + result.consents.map(view).join('') + result.samples.map(view).join('') +
    '</table><p class="muted">待归还样本归还后将直接销毁，可在列表中点击“归还（将直接销毁）”。' +
    '相同执行请求（同一 Idempotency-Key）重试会返回本次结果。</p>';
  openModal(body, '<button class="primary" onclick="closeModal();refresh()">完成</button>');
  await refresh();
  state.message = null;
}

/* ---------- create dialogs ---------- */
function openCreate(kind) {
  let body = '', fields = '';
  if (kind === 'participant') fields = '<p><label>姓名</label><input type="text" id="f-name" value="参与者 ' + (state.participants.length + 1) + '"></p>';
  if (kind === 'consent') fields = participantSelect() + '<p><label>范围（逗号分隔）</label><input type="text" id="f-scope" value="research"></p>';
  if (kind === 'sample') fields = participantSelect() +
    '<p><label>样本编号</label><input type="text" id="f-code" value="B-' + (state.samples.length + 1) + '"></p>' +
    '<p><label>采集日期</label><input type="text" id="f-collected" value="2026-01-01"></p>';
  if (kind === 'withdrawal') fields = participantSelect() +
    '<p><label>申请日期</label><input type="text" id="f-requested" value="2026-03-01"></p>';
  body = '<h2>新建' + ({participant:'参与者',consent:'同意',sample:'样本',withdrawal:'撤回申请'}[kind]) + '</h2>' + fields +
    '<div id="createMsg"></div>';
  openModal(body, '<button class="primary" id="createBtn">创建</button>');
  document.getElementById('createBtn').onclick = async () => {
    let data, role = 'admin';
    const p = document.getElementById('f-participant');
    try {
      if (kind === 'participant') data = {name: document.getElementById('f-name').value};
      if (kind === 'consent') { role = 'committee'; data = {participant_id: p.value, scope: document.getElementById('f-scope').value.split(',').map(s => s.trim()).filter(Boolean)}; }
      if (kind === 'sample') { role = 'biobank'; data = {participant_id: p.value, sample_code: document.getElementById('f-code').value, collected_at: document.getElementById('f-collected').value}; }
      if (kind === 'withdrawal') { role = 'biobank'; data = {participant_id: p.value, requested_at: document.getElementById('f-requested').value}; }
      await create(kind, data, role);
      closeModal();
      await refresh();
    } catch (error) {
      showInline('createMsg', error);
    }
  };
}
function participantSelect() {
  return '<p><label>参与者</label><select id="f-participant">' +
    state.participants.map(p => '<option value="' + esc(p.id) + '">' + esc(p.data.name) + '</option>').join('') +
    '</select></p>';
}

async function seedDemo() {
  try {
    const p = await create('participants', {name: '演示参与者 张'}, 'admin');
    let c = await create('consents', {participant_id: p.id, scope: ['research']}, 'committee');
    c = await action(c.id, 'activate', {scope: ['research'], version: 'v1', expires_at: '2099-01-01'}, 'committee');
    let s1 = await create('samples', {participant_id: p.id, sample_code: 'D-001', collected_at: '2026-01-01'}, 'biobank');
    s1 = await action(s1.id, 'store', {freezer: 'F1', position: 'A1', consent_id: c.id}, 'biobank');
    let s2 = await create('samples', {participant_id: p.id, sample_code: 'D-002', collected_at: '2026-01-02'}, 'biobank');
    s2 = await action(s2.id, 'store', {freezer: 'F1', position: 'A2', consent_id: c.id}, 'biobank');
    await action(s2.id, 'loan', {recipient: '合作医院', purpose: '课题', due_at: '2026-12-31'}, 'biobank');
    let w = await create('withdrawals', {participant_id: p.id, requested_at: '2026-03-01'}, 'biobank');
    await action(w.id, 'approve', {reason: '参与者书面要求', sample_ids: [s1.id, s2.id]}, 'committee');
    state.message = null;
    await refresh();
  } catch (error) {
    state.message = {type: 'error', title: '演示数据生成失败：' + error.message, body: detailText(error)};
    render();
  }
}

/* ---------- helpers ---------- */
async function runAction(fn) {
  try {
    await fn();
    state.message = null;
  } catch (error) {
    state.message = {type: 'error', title: '操作被拒绝：' + error.message, body: detailText(error)};
  }
  await refresh();
}
function detailText(error) {
  const details = error.payload && error.payload.details;
  if (!details) return '';
  return details.map(d => '· [' + d.kind + '] ' + d.id + '：' + d.message +
    (d.current_status ? '（当前状态: ' + d.current_status + '）' : '')).join('\n');
}
function showInline(id, error) { showInlineEl(document.getElementById(id), error); }
function showInlineEl(el, error) {
  if (!el) return;
  el.className = 'error';
  el.textContent = error.message + (detailText(error) ? '\n' + detailText(error) : '');
}
function openModal(html, okHtml) {
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOk').innerHTML = okHtml || '';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

refresh().catch(error => {
  document.getElementById('root').innerHTML = '<div class="error">加载失败：' + esc(error.message) + '</div>';
});
</script>
</body>
</html>
